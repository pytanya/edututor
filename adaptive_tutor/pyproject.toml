[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-tutor"
version = "0.1.0"
description = "Production-ready AI agent for adaptive learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "EduTutor Team" },
]
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tavily-python>=0.8.0",
    "ddgs>=9.0.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
